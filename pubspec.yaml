name: sky_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  #Storage
  shared_preferences: 2.5.5
  flutter_secure_storage: 10.3.0
  cached_network_image_ce: 4.10.0

  #State Management
  provider: 6.1.5+1

  #Routing
  go_router: 17.5.0

  #UI
  flutter_svg: 2.3.0
  timeago: 3.7.1

  #Web & External Links
  dio: 5.11.0
  webview_flutter: 4.14.1
  url_launcher: 6.3.2

  #Auth
  flutter_appauth: 12.0.2
  crypto: 3.0.7
  reicon_flutter: 1.0.1
  animations: 2.2.0
  palette_generator_master: 1.1.0
  share_plus: 13.3.0

  #Other
  sensors_plus: 7.1.0
  permission_handler: 13.0.1
  flutter_nfc_kit: 3.6.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - assets/icons/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
