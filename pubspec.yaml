name: sky_app
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter

  #Storage
  shared_preferences: 2.5.6
  flutter_secure_storage: 11.2.0
  cached_network_image_ce: 4.13.2

  #State Management
  provider: 6.1.5+1

  #Routing
  go_router: 18.1.4

  #UI
  material_ui: 1.11.1
  flutter_svg: 2.5.0
  timeago: 3.7.1

  #Web & External Links
  dio: 5.11.1
  webview_flutter: 4.14.1
  url_launcher: 6.3.3
  flutter_custom_tabs: 2.6.0

  #Auth
  flutter_appauth: 13.0.0
  crypto: 3.0.8
  reicon_flutter: 1.0.1
  animations: 3.0.0
  share_plus: 13.3.1

  #Other
  sensors_plus: 7.1.1
  flutter_nfc_kit: 3.7.0
  image_picker: 1.2.4
  pretty_qr_code: 3.6.0
  mobile_scanner: 7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/teams/
    - assets/fonts/
    - shorebird.yaml

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins/Poppins-Bold.ttf
          weight: 800
        - asset: assets/fonts/Poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins/Poppins-SemiBold.ttf
          weight: 600
